name: Resume refresh source intake
on:
  push:
    branches: [docs/resume-cloudflare-20261018]
    paths: [.github/workflows/resume-refresh-intake.yml]
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact public source revision
        run: |
          mkdir -p intake
          git archive --format=tar HEAD > intake/source.tar
          git rev-parse HEAD > intake/revision.txt
      - name: Inspect public deployment without credentials
        shell: python
        run: |
          import urllib.request, pathlib, json
          results=[]
          for name,url in [('custom','https://fairyllm.com/'),('legacy','https://babyzmz.github.io/mingzhe-portfolio-v2/')]:
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Portfolio-content-review','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=25) as response:
                      data=response.read()
                      pathlib.Path('intake/'+name+'.html').write_bytes(data)
                      results.append({'name':name,'status':response.status,'url':response.url,'server':response.headers.get('server'),'cf_ray':bool(response.headers.get('cf-ray'))})
              except Exception as exc: results.append({'name':name,'error':str(exc)})
          pathlib.Path('intake/public-hosts.json').write_text(json.dumps(results,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: resume-refresh-intake
          path: intake/
          retention-days: 7
