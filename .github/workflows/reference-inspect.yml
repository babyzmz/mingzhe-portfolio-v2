name: Inspect requested animation reference
on:
  push:
    branches: [fix/sync-local-and-contact-20260923]
    paths: [.github/workflows/reference-inspect.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch public component reference
        shell: python
        run: |
          import pathlib, re, urllib.request
          root = pathlib.Path('reference'); root.mkdir()
          base = 'https://www.rewampui.com/assets/'
          text = urllib.request.urlopen(base + 'ComponentsPage-DQnxaloO.js', timeout=30).read().decode()
          (root / 'components.js').write_text(text)
          paths = set(re.findall(r'(?:assets/|\./)?(Word[^"\s/]+\.js)', text))
          for name in paths:
              (root / name).write_bytes(urllib.request.urlopen(base + name, timeout=30).read())
      - uses: actions/upload-artifact@v4
        with:
          name: animation-reference
          path: reference/
          retention-days: 1
