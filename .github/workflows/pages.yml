name: Deploy static site to Pages

# Publication starts as an explicitly approved, manual action. Enable the
# push trigger only after the first reviewed deployment and rollback plan.
on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Pages environment (normally github-pages)'
        required: false
        default: 'github-pages'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Build networked edition (production artifact)
        run: npm run build
      - name: Privacy gate
        run: npm run privacy-check
      - name: Confirm artifact excludes private data
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse -Force 'dist' | Where-Object { $_.Name -like '*handoff*' }) {
            throw 'private handoff content found inside dist'
          }
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload only dist as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment_name || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
