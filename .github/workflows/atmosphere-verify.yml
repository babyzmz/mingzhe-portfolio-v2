name: Verify atmosphere and preserved interactions
on:
  push:
    branches: [main, feat/reactbits-atmosphere-20260923]
    paths: ['src/**', 'styles/**', 'tests/**', 'public/**', 'scripts/**', 'index.html', 'package*.json', '.github/workflows/atmosphere-verify.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and test both editions
        run: |
          npm run build:offline
          npm run build
          npm test
          node --test tests/bundle.test.mjs
          npm run privacy-check
      - name: Install real browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: WebGL effects and interaction acceptance
        env:
          PORTFOLIO_BROWSER_ARGS: --no-sandbox;--enable-unsafe-swiftshader
        run: python tests/atmosphere.browser.py
      - name: Settled WebGL screenshots and text readability
        env:
          PORTFOLIO_BROWSER_ARGS: --no-sandbox;--enable-unsafe-swiftshader
        run: python tests/capture-atmosphere.py
      - name: Explicit no-WebGL acceptance
        env:
          PORTFOLIO_BROWSER_ARGS: --no-sandbox
          ATMOSPHERE_TEST_OUTPUT: test-artifacts/atmosphere-fallback
        run: python tests/atmosphere.browser.py --fallback
      - name: Preserve exact verification revision
        if: always()
        run: |
          mkdir -p test-artifacts
          git rev-parse HEAD > test-artifacts/verification-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atmosphere-acceptance
          path: test-artifacts/
          retention-days: 7
